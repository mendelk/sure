services:
  app:
    image: ${ORCA_IMAGE:?ORCA_IMAGE is required}
    stdin_open: true
    tty: true
    environment:
      BINDING: "0.0.0.0"
      BUNDLE_PATH: /bundle
      DB_HOST: db
      ORCA_SEED_SAMPLE_DATA: "1"
      ORCA_SSH_PUBLIC_KEY: ${ORCA_SSH_PUBLIC_KEY:?ORCA_SSH_PUBLIC_KEY is required}
      PORT: 3000
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      REDIS_URL: redis://redis:6379/1
      SELENIUM_REMOTE_URL: ${ORCA_SELENIUM_REMOTE_URL:-}
      SURE_SKIP_YJIT: ${ORCA_SKIP_YJIT:-}
    volumes:
      - ${ORCA_WORKTREE_PATH:?ORCA_WORKTREE_PATH is required}:/workspace
      - bundle:/bundle
      - npm-cache:/root/.npm
    ports:
      - ${ORCA_PUBLISH_HOST:-127.0.0.1}::22
      - ${ORCA_PUBLISH_HOST:-127.0.0.1}::3000
    depends_on:
      - redis
    networks:
      - default
      - shared

  redis:
    image: docker.io/library/redis:latest
    volumes:
      - redis:/data

volumes:
  bundle:
  npm-cache:
    external: true
    name: sure-orca-shared-npm-cache
  redis:

networks:
  default: {}
  shared:
    external: true
    name: sure-orca-shared
