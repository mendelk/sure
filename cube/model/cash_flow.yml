# Generated by bin/rails cube:generate; do not edit.
---
cubes:
- name: cash_flow
  sql: |-
    SELECT ae.id AS id,
           ae.date AS date,
           a.id AS account_id,
           a.family_id AS family_id,
           COALESCE(c.name, 'Uncategorized') AS category,
           a.name AS account,
           f.currency AS reporting_currency,
           CASE WHEN t.kind IN ('investment_contribution', 'loan_payment') THEN 'expense' WHEN ae.amount < 0 THEN 'income' ELSE 'expense' END AS classification,
           CASE WHEN t.kind IN ('investment_contribution', 'loan_payment') THEN ABS(ae.amount * COALESCE(er.rate, 1)) ELSE ae.amount * COALESCE(er.rate, 1) END AS amount
    FROM transactions t
    JOIN entries ae ON ae.entryable_id = t.id AND ae.entryable_type = 'Transaction'
    JOIN accounts a ON a.id = ae.account_id
    JOIN families f ON f.id = a.family_id
    LEFT JOIN categories c ON c.id = t.category_id
    LEFT JOIN exchange_rates er ON (
      er.date = ae.date AND
      er.from_currency = ae.currency AND
      er.to_currency = f.currency
    )
    WHERE t.kind NOT IN ('funds_movement', 'one_time', 'cc_payment')
      AND ae.excluded = false
      AND a.status IN ('draft', 'active')
      AND a.exclude_from_reports = false
      AND (
      t.investment_activity_label IS NULL
      OR t.investment_activity_label NOT IN ('Transfer', 'Sweep In', 'Sweep Out', 'Exchange')
    )
      AND (t.extra -> 'simplefin' ->> 'pending')::boolean IS DISTINCT FROM true
    AND (t.extra -> 'plaid' ->> 'pending')::boolean IS DISTINCT FROM true
    AND (t.extra -> 'lunchflow' ->> 'pending')::boolean IS DISTINCT FROM true
    AND (t.extra -> 'enable_banking' ->> 'pending')::boolean IS DISTINCT FROM true
    AND (t.extra -> 'akahu' ->> 'pending')::boolean IS DISTINCT FROM true
    AND (t.extra -> 'up' ->> 'pending')::boolean IS DISTINCT FROM true
    AND (t.extra -> 'monobank' ->> 'pending')::boolean IS DISTINCT FROM true
    AND (t.extra -> 'mercury' ->> 'pending')::boolean IS DISTINCT FROM true
    AND (t.extra -> 'redbark' ->> 'pending')::boolean IS DISTINCT FROM true
    AND (t.extra -> 'financekit' ->> 'pending')::boolean IS DISTINCT FROM true
  refresh_key:
    every: 10 seconds
  dimensions:
  - name: id
    sql: "{CUBE}.id"
    type: string
    primary_key: true
  - name: family_id
    sql: "{CUBE}.family_id"
    type: string
  - name: account_id
    sql: "{CUBE}.account_id"
    type: string
  - name: date
    sql: "{CUBE}.date::timestamp"
    type: time
  - name: category
    sql: "{CUBE}.category"
    type: string
  - name: account
    sql: "{CUBE}.account"
    type: string
  - name: reporting_currency
    sql: "{CUBE}.reporting_currency"
    type: string
  measures:
  - name: count
    type: count
  - name: income
    type: sum
    sql: CASE WHEN {CUBE}.classification = 'income' THEN -{CUBE}.amount ELSE 0 END
    format: currency
  - name: expenses
    type: sum
    sql: CASE WHEN {CUBE}.classification = 'expense' THEN {CUBE}.amount ELSE 0 END
    format: currency
  - name: savings
    type: number
    sql: "{income} - {expenses}"
    format: currency
